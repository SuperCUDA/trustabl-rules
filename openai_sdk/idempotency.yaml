policy:
  id: openai_sdk_idempotency
  name: OpenAI Agents SDK mutating-tool idempotency
  category: openai_sdk
  description: >
    Rules that flag mutating OpenAI Agents SDK tools without an idempotency
    key. Agents retry tool calls under timeouts and ambiguous failures; without
    a key the same side-effecting action can fire more than once.

rules:
  - id: OAI-009
    title: Mutating tool has no idempotency key
    severity: medium
    confidence: 0.55
    language: python
    applies_to:
      - openai_tool
    scope: tool
    match:
      all:
        - name_has_prefix:
            - create_
            - send_
            - delete_
            - post_
            - update_
            - refund_
            - charge_
            - issue_
        - not:
            param_name_matches:
              contains:
                - idempot
              exact:
                - request_id
                - txn_id
    explanation: >
      Tool name suggests a side effect (create/send/refund/…). A mutating tool
      with no idempotency key cannot tell a new request from a retry of one whose
      result was lost. Retries are not automatic in the OpenAI Agents SDK, but
      they still happen — the model re-invokes a tool when a result reads as
      inconclusive, an orchestrator or your own retry policy re-issues after a
      timeout, or a response is lost after the side effect already committed
      (at-least-once delivery). Without a key the same action fires twice; the
      downstream service must also honor the key for this to help.
    fix: >
      Add an `idempotency_key: str` parameter and pass it to the backing API.

  - id: OAI-019
    title: TypeScript mutating tool has no idempotency key
    severity: medium
    confidence: 0.5
    language: typescript
    applies_to:
      - openai_tool
    scope: tool
    match:
      all:
        - name_has_prefix:
            - create
            - send
            - delete
            - post
            - update
            - refund
            - charge
            - issue
        - not:
            has_body_text:
              - idempot
              - request_id
              - requestId
              - txn_id
              - txnId
              - correlation_id
              - correlationId
    explanation: >
      An OpenAI Agents SDK tool authored in TypeScript whose name implies a
      side effect (create/send/delete/refund/...) has no idempotency token
      visible in its body. The SDK does not retry tool calls for you by default,
      but retries still happen — the model re-invokes the tool whenever a result
      reads as inconclusive, and an orchestrator, your own retry policy, or a
      lost response (at-least-once delivery) can re-issue the call; without a key
      threaded through to the backing API the same action fires twice, producing
      duplicate tickets, payments, emails, or deletions. The prefix set matches
      both `create_charge` and `createCharge` naming, so it fires on idiomatic
      TypeScript tool names.
    fix: >
      Add an `idempotencyKey: string` parameter to the tool's zod schema and
      forward it to the underlying API (Stripe `Idempotency-Key` header,
      REST `X-Request-ID`, GraphQL `clientMutationId`, etc.). If the backing
      service does not honor idempotency keys, document the gap and dedupe
      in your own store keyed by the token before issuing the call.
  - id: OAI-026
    title: Exact-named mutating tool has no idempotency key
    severity: medium
    confidence: 0.55
    language: python
    applies_to:
      - openai_tool
    scope: tool
    match:
      all:
        - name_in:
            - pay
            - refund
            - charge
            - transfer
            - checkout
            - purchase
            - cancel
            - submit
        - not:
            param_name_matches:
              contains:
                - idempot
              exact:
                - request_id
                - txn_id
    explanation: >
      This tool's name is a bare mutation verb (pay, refund, charge, transfer,
      checkout, …) and it exposes no idempotency-key parameter. OAI-009 catches
      mutating tools whose names carry a create_/send_/refund_ prefix, but a
      tool named exactly `refund` or `charge` has no trailing separator and
      slips past that prefix match — yet it is just as side-effecting. Agents
      re-invoke tools when a result reads as inconclusive, and an orchestrator
      or a lost response (at-least-once delivery) re-issues calls after a
      timeout; without a key threaded to the backing API the same payment,
      transfer, or cancellation fires twice.
    fix: >
      Add an `idempotency_key: str` parameter and forward it to the backing API
      (Stripe Idempotency-Key, REST X-Request-ID, GraphQL clientMutationId). If
      the downstream service ignores the key, dedupe in your own store keyed by
      the token before issuing the call.
